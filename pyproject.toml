[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "teddystudio"
version = "0.4.2"
description = "Windows audiobook library, audio editor and verified TeddyCloud importer"
requires-python = ">=3.11"
dependencies = ["PySide6-Addons>=6.8,<7", "mutagen>=1.47,<2", "Pillow>=11,<14", "requests>=2.32,<3"]

[project.scripts]
teddystudio = "teddystudio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

